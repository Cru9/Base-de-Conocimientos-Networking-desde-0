name: Lint & Validate Documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-markdown:
    name: Validate Markdown Syntax & Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify No TXT Files in Modules
        run: |
          TXT_COUNT=$(find . -name "*.txt" -not -path "./.git/*" | wc -l)
          if [ "$TXT_COUNT" -gt 0 ]; then
            echo "❌ ERROR: Se detectaron $TXT_COUNT archivos .txt. Todos los documentos deben ser .md."
            find . -name "*.txt" -not -path "./.git/*"
            exit 1
          fi
          echo "✅ Todos los documentos están en formato Markdown (.md)."

      - name: Check Relative Markdown Links
        run: |
          python -c "
          import os, re, sys
          broken = 0
          for root, dirs, files in os.walk('.'):
              if '.git' in root: continue
              for f in files:
                  if f.endswith('.md'):
                      p = os.path.join(root, f)
                      with open(p, 'r', encoding='utf-8') as fp:
                          text = fp.read()
                      for match in re.finditer(r'\[([^\]]+)\]\(([^)]+)\)', text):
                          target = match.group(2)
                          if target.startswith(('http://', 'https://', 'mailto:', '#')):
                              continue
                          # Clean anchor
                          clean_target = target.split('#')[0]
                          if not clean_target:
                              continue
                          target_path = os.path.normpath(os.path.join(root, clean_target))
                          if not os.path.exists(target_path):
                              print(f'❌ Enlace roto en {p}: -> {target}')
                              broken += 1
          if broken > 0:
              print(f'Total de enlaces rotos: {broken}')
              sys.exit(1)
          else:
              print('✅ Todos los enlaces relativos existen y son válidos.')
          "
